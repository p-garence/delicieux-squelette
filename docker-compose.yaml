services:
  db:
    image: postgres:16.0-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data

  gourmand-zombie:
    build: ./gourmand-zombie
    restart: always
    user: 1000:1000
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "1420:1420"
    depends_on:
      - db

  delicieux-squelette:
    build: ./delicieux-squelette
    restart: always
    user: 1000:1000
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://gourmand-zombie:1420 
      - PUBLIC_API_URL=${PUBLIC_API_URL}
    depends_on:
      - gourmand-zombie

volumes:
  db_data:
    driver: local